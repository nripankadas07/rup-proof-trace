[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rup-proof-trace"
version = "0.1.0"
description = "Explain small RUP additions with assumptions, unit reasons and an explicit final-empty-clause requirement."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
[project.scripts]
rup-proof-trace = "rup_proof_trace:main"
[tool.setuptools]
py-modules = ["rup_proof_trace"]
